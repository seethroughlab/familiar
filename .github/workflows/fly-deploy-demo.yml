name: Fly Deploy (demo)

on:
  workflow_dispatch:
  # **Restored** (ADR-0038 point 4). This was commented out "while demo is offline", and the comment
  # then became the documentation: the demo drifted from `main` for months because bringing it up
  # was a manual step somebody had to remember. A demo that disproves the submitted build is worse
  # than no demo.
  #
  # Scoped, so a frontend-only or docs-only change does not redeploy a backend that has not moved.
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/fly/**'
      - '.github/workflows/fly-deploy-demo.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy familiar-demo
    runs-on: ubuntu-latest
    concurrency: fly-demo-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy . --remote-only --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
