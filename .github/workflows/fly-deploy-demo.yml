name: Fly Deploy (demo)

on:
  workflow_dispatch:
  # Auto-deploy on push disabled while demo is offline.
  # To re-enable: uncomment the `push:` block below.
  # push:
  #   branches:
  #     - master
  #   paths:
  #     - 'backend/**'
  #     - 'deploy/fly/**'
  #     - '.github/workflows/fly-deploy-demo.yml'

jobs:
  deploy:
    name: Deploy familiar-demo
    runs-on: ubuntu-latest
    concurrency: fly-demo-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy . --remote-only --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
