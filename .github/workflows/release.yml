name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Philosophy: this workflow runs on GitHub-hosted runners, except the Familiar Server job,
# which needs the self-hosted Mac (ADR-0135 point 2). The
# self-hosted NAS runner used for everyday CI has unreliable upstream
# connectivity, which repeatedly broke the cold multi-stage Docker build
# needed to cut releases. Public repos get unlimited GitHub-hosted minutes,
# so there's no cost argument against this. Each arch builds natively
# (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64) — no QEMU.
#
# Shape follows the docker/build-push-action multi-platform pattern:
#   1. wait-for-ci   → poll ci.yml conclusion
#   2. build (matrix) → build + push by digest per arch, in parallel
#   3. merge         → combine digests into tagged manifest list
#   4. smoke-test    → pull + run native CLAP smoke test per arch; verify the
#                      CLAP encoders against the hashes pinned in the backend,
#                      and (amd64) extract them as release assets
#   5. create-release → move `latest` (and major/minor) to this build, then the GitHub
#                      release with generated notes and the encoders
#   6. familiar-server → the notarized Familiar Server .dmg, on the self-hosted macOS runner,
#                      attached to that release (ADR-0135)

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Waiting for CI to pass on $SHA..."
          for i in $(seq 1 120); do
            RESULT=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | .conclusion // .status')
            case "$RESULT" in
              success)
                echo "CI passed"
                exit 0
                ;;
              failure|cancelled|timed_out)
                echo "::error::CI failed on this commit (result: $RESULT)"
                exit 1
                ;;
              *)
                echo "CI status: ${RESULT:-no run found} (attempt $i/120, waiting 30s...)"
                sleep 30
                ;;
            esac
          done
          echo "::error::Timed out waiting for CI after 60 minutes"
          exit 1

  build:
    name: Build (${{ matrix.platform }})
    needs: wait-for-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Platform pair (for cache scope and artifact name)
        id: prep
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version string
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create manifest list
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the tags that name this build. The moving ones (`latest`, `0.2`, `0`) are added
          # by create-release, after the smoke tests: v0.2.0-beta8's first run pushed `latest`
          # here, and its smoke tests then failed on encoders that did not match their pins.
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  smoke-test:
    name: Smoke Test (${{ matrix.platform }})
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image (native arch)
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }}

      - name: Smoke test (imports, artifacts, providers)
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }} \
            python /app/scripts/smoke_test_clap.py --skip-model

      - name: Smoke test (real embeddings)
        timeout-minutes: 15
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }} \
            python /app/scripts/smoke_test_clap.py

      # ADR-0132 point 8. The encoders are exported inside the image build, from a script the
      # Dockerfile fetches from clapback's main branch. The backend pins their SHA-256
      # (app/services/clap_artifacts.py) because the export has been byte-identical across
      # releases and architectures. An export that drifts fails the release here, rather than
      # silently moving every vector, and every server outside Docker would refuse the new files anyway.
      - name: Verify CLAP encoders against the pinned hashes
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }} \
            python -m app.services.clap_artifacts verify /app/models/clapback

      # One copy is enough: the step above just proved both architectures carry identical bytes.
      - name: Extract CLAP encoders
        if: matrix.platform == 'linux/amd64'
        run: |
          mkdir -p /tmp/clap
          cid=$(docker create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }})
          docker cp "$cid:/app/models/clapback/clap_audio.onnx" /tmp/clap/
          docker cp "$cid:/app/models/clapback/clap_text.onnx" /tmp/clap/
          docker rm "$cid"
          (cd /tmp/clap && sha256sum clap_audio.onnx clap_text.onnx > SHA256SUMS && cat SHA256SUMS)

      - name: Upload CLAP encoders
        if: matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@v4
        with:
          name: clap-encoders
          path: /tmp/clap/*
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [merge, smoke-test]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Moving tags
        id: moving
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', github.event.inputs.version) || startsWith(github.ref, 'refs/tags/v') }}

      # Only now that both architectures passed the smoke tests, including the encoder hashes.
      - name: Point the moving tags at this release
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          [ -n "$tags" ] || { echo "no moving tags for this ref"; exit 0; }
          docker buildx imagetools create $tags \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }}

      - name: Download CLAP encoders
        uses: actions/download-artifact@v4
        with:
          name: clap-encoders
          path: clap-encoders

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Fetched by servers that run outside Docker, from the release matching their own
          # version, and accepted only if they match the backend's pinned hashes (ADR-0132).
          files: |
            clap-encoders/clap_audio.onnx
            clap-encoders/clap_text.onnx
            clap-encoders/SHA256SUMS
          body: |
            ## Docker Installation

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.merge.outputs.version }}
            ```

            See the [installation guide](https://github.com/${{ github.repository }}#installation) for detailed setup instructions.

  # ADR-0135: Familiar Server, the macOS form of the server, from the same tag as the image. It runs
  # after the release exists and attaches to it, so the runner — a laptop — can delay the .dmg but
  # never the Docker release. The checkout's clean step removes desktop/macos/build, so Postgres,
  # ffmpeg and Chromaprint are built fresh for every release rather than trusted from a cache.
  familiar-server:
    name: Familiar Server (macOS)
    needs: create-release
    runs-on: [self-hosted, macOS]
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      # The tag, `v` and all, as the image is given it: the backend reports it and fetches its CLAP
      # encoders from the release of that name. The scripts drop the `v` where macOS wants a number.
      TAG: ${{ github.event.inputs.version || github.ref_name }}
      NOTARY_KEY_ID: ${{ secrets.FAMILIAR_ASC_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.FAMILIAR_ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # A keychain of its own, for this job only: the runner's login keychain is a person's, and
      # a release should not depend on what happens to be in it.
      - name: Import the Developer ID identity and the notary key
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          FAMILIAR_ASC_PRIVATE_KEY: ${{ secrets.FAMILIAR_ASC_PRIVATE_KEY }}
        run: |
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD FAMILIAR_ASC_PRIVATE_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/familiar-server-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm "$RUNNER_TEMP/developer-id.p12"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the p12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$FAMILIAR_ASC_PRIVATE_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the payload
        run: desktop/macos/scripts/build-payload.sh "$TAG"

      - name: Build and sign the app
        run: desktop/macos/scripts/build-app.sh "$TAG"

      - name: Package and notarize
        run: desktop/macos/scripts/package.sh "$TAG"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "desktop/macos/build/Familiar-Server-${TAG#v}.dmg" --clobber

      # After the upload: the feed must never name a file that is not there yet. Every installed
      # Familiar Server reads this branch (ADR-0135 point 3), so a key that does not match the one
      # the app carries fails here, not on everyone's Mac.
      - name: Publish the update to the Sparkle feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::secret SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }
          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          desktop/macos/scripts/publish-update.sh "$TAG" "$RUNNER_TEMP/sparkle.key"

      - name: Remove the signing keychain and the notary and update keys
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
