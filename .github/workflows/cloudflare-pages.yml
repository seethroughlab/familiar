name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "screenshots/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Named for where it deploys. It was `pages.yml` with a job called "Deploy Pages" while
  # deploying to Cloudflare, which is how `site/README.md` came to describe GitHub Pages, a CNAME
  # this repository does not contain, and DNS pointing at seethroughlab.github.io. ADR-0039 point 7
  # fixed the README and left this, noting it was the only thing keeping the confusion alive.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          # Render docs/VISUALIZER_API.md into site/visualizers.html before the copy
          # (ADR-0103 point 1). The Markdown file stays the source; this is one script
          # over one known file, not a generator -- see ADR-0039 point 6.
          python3 site/scripts/render-docs.py
          mkdir -p _site
          cp -R site/. _site/
          cp -R screenshots _site/screenshots
          # site/ is copied wholesale, so anything dropped in it ships. These are working
          # files, not pages: the illustration prompts, the mark-extraction script, the
          # README describing the directory itself, and the Playwright suite that tests the
          # install toggle (ADR-0095) along with its config and run artefacts.
          rm -rf _site/scripts _site/ILLUSTRATIONS.md _site/README.md \
                 _site/e2e _site/playwright.config.ts _site/visualizers.json

      # ADR-0069 point 5's concern, kept after that ADR was rejected: the claim
      # ledger is the only mechanism standing between this site and lying by
      # attrition, and until now nothing ran it. `--offline` here because the
      # external-link and live-site checks belong after the deploy, not before it.
      - name: Check site claims
        run: python3 site/scripts/check-claims.py --offline

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: familiar-site
          directory: _site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # ADR-0097: the live site served an April build for four months while every
      # check passed, because they all audited the working tree. This one fetches
      # what is actually published, and it can only run after the deploy.
      - name: Verify the deployed site
        run: |
          sleep 30
          python3 site/scripts/check-claims.py
