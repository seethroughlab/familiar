name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy app --ignore-missing-imports

  backend-test:
    name: Backend Test
    runs-on: [self-hosted, Linux]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familiar
          POSTGRES_PASSWORD: familiar
          POSTGRES_DB: familiar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
        run: uv run python -m alembic upgrade head

      - name: Migration preflight
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
        run: uv run python -c "from app.db.migration_preflight import assert_database_at_head; assert_database_at_head()"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -v --tb=short

  frontend-lint:
    name: Frontend Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @familiar/frontend run lint

      - name: Audio Guardrail Checks
        run: pnpm --filter @familiar/frontend run check:audio-guardrails

  frontend-build:
    name: Frontend Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @familiar/web run build

      - name: Bundle Budget Checks
        env:
          # Temporary bootstrap hard ceiling while Phase 6 split work reduces entry size.
          # Targets are still enforced as warnings by the checker.
          BUNDLE_ENTRY_GZIP_HARD_KB: '460'
        run: pnpm --filter @familiar/web run check:bundle-budgets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/web/dist
          retention-days: 7

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-perf-metrics
          path: artifacts/perf
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: self-hosted
    timeout-minutes: 30
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          docker system prune -af --volumes || true
          df -h || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: familiar:test

  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: [self-hosted, Linux]
    needs: [docker-build]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familiar
          POSTGRES_PASSWORD: familiar
          POSTGRES_DB: familiar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
        run: uv run python -m alembic upgrade head

      - name: Migration preflight
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
        run: uv run python -c "from app.db.migration_preflight import assert_database_at_head; assert_database_at_head()"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for E2E tests
        run: |
          pnpm --filter @familiar/web run build
          mkdir -p backend/static
          cp -r packages/web/dist/* backend/static/

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
          REDIS_URL: redis://localhost:6379/0
          MUSIC_LIBRARY_PATH: ${{ github.workspace }}/backend/tests/fixtures/audio
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 4401 &
          sleep 10

      - name: Install Playwright browsers
        working-directory: packages/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: packages/web
        env:
          BASE_URL: http://localhost:4401
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        # Exclude screenshot specs - they're for README docs, not CI testing
        run: npx playwright test --grep-invert="screenshot"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
