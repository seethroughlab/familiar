# CI.
#
# **Linux jobs run on GitHub-hosted runners, not the NAS.** This repository is public, so the
# minutes cost nothing, and each job gets a machine of its own.
#
# They used to default to the self-hosted runner on the NAS, which also serves the music library,
# runs Frigate and Plex, and hosts a second repository's runner. On 2026-10-01 a Familiar E2E job and
# that other repository's job overlapped there, memory ran out, and the NAS thrashed without an OOM
# kill for over an hour until it was power-cycled: no music, no cameras, and every queued check
# pending. Before that it had gone offline for hours with four PRs queued and nothing mergeable,
# because a self-hosted runner that is down never starts a check, so nothing fails. A Docker build
# there had also stalled playback outright (a 20 MB track from ~1.5 s to ~40 s).
#
# The runner is still a repository variable, so the tenancy can change without editing this file:
# set `CI_LINUX_RUNNER` to `["self-hosted","Linux"]` (or `CI_RUNNER` to `self-hosted`) to send jobs
# back to the NAS, deliberately and knowing the above.
#
# `Familiar Server (core)` and `macOS Compose Integration` stay on the self-hosted Mac: the first
# builds the Mac app, and GitHub's macOS runners have no Docker daemon for the second.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # **CI runs the interpreter production runs, pinned to the patch.**
  #
  # This must stay equal to the tag in `docker/Dockerfile`. There is no way to share one value
  # between a workflow and a Dockerfile, so they are kept in step by hand — change both together.
  #
  # Two separate lessons are baked into this line, both learned on 2026-08-22:
  #
  # 1. **A minor-level pin is not a pin.** The six `uv python install` steps below only make an
  #    interpreter *available*; they never decided the one `uv run` selects, and
  #    `requires-python = ">=3.11"` is a floor, not a choice. That resolved to 3.12.13 on the NAS
  #    and 3.12.14 on a GitHub-hosted runner, with byte-identical dependency sets (pytest 9.0.2,
  #    pytest-asyncio 1.3.0), and two tests passed on .13 and failed on .14 —
  #    `asyncio.get_event_loop()` no longer creates a loop when none is running. One patch release
  #    was the whole difference, so `UV_PYTHON` carries the patch.
  #
  # 2. **CI was testing an interpreter nothing ships.** The first pin landed on 3.12 while
  #    production has always been `python:3.11-slim` — a whole minor version that no test could
  #    see. Point 1 is the evidence for why that mattered: if two *patch* releases can disagree
  #    about a core stdlib call, a minor gap between CI and production is not a detail.
  UV_PYTHON: "3.11.15"

# **One run per branch; a new push cancels the one it supersedes.**
#
# Without this, every commit queues a full CI run and none of them go away. On 2026-08-09 a branch
# pushed eight commits in an hour and left seven dead runs queued — for commits that were no longer
# the branch head — on a self-hosted pool of three runners, two of which are the only ones that can
# take `[self-hosted, Linux]`. The head commit's own jobs then sat behind its own history.
#
# Hosted runners hide this because the pool is effectively unbounded. Self-hosted does not.
#
# `main` is deliberately excluded from cancellation: those runs gate deploys and a superseded one is
# still worth having finished. `github.run_id` makes each `main` run its own group, so they queue
# rather than cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos-compose-check:
    name: macOS Compose Check
    # Parses compose files; nothing here is macOS-specific, and a bare `self-hosted` label could land
    # on any self-hosted machine.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate macOS compose override merges cleanly
        working-directory: docker
        run: docker compose -f docker-compose.prod.yml -f docker-compose.desktop.yml config > /dev/null

      - name: Assert no journald in merged config
        working-directory: docker
        run: |
          if docker compose -f docker-compose.prod.yml -f docker-compose.desktop.yml config | grep -q 'journald'; then
            echo "::error::Merged macOS compose config still contains journald logging driver"
            exit 1
          fi
          echo "No journald references found in merged config"

      - name: Assert all prod services have macOS logging overrides
        working-directory: docker
        run: |
          # Count services in prod that use journald
          PROD_JOURNALD=$(docker compose -f docker-compose.prod.yml config | grep -c 'driver: journald' || true)
          # Count services in merged config that use journald (should be 0)
          MERGED_JOURNALD=$(docker compose -f docker-compose.prod.yml -f docker-compose.desktop.yml config | grep -c 'driver: journald' || true)
          echo "Prod journald services: $PROD_JOURNALD, After macOS override: $MERGED_JOURNALD"
          if [ "$MERGED_JOURNALD" -gt 0 ]; then
            echo "::error::$MERGED_JOURNALD service(s) still using journald after macOS override — update docker-compose.desktop.yml"
            exit 1
          fi

  # Familiar Server's decisions (ADR-0136): paths, launch specs, restart backoff, etiquette,
  # debounce, pairing link. The assembled app needs signing identities and a payload build, so
  # `desktop/macos/scripts/integration-check.sh` runs locally rather than here.
  familiar-server-core:
    name: Familiar Server (core)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/macos
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift build && swift test
      # The Sparkle feed's release notes (scripts/appcast.py), run by the release job and nowhere
      # else, so a mistake would otherwise first show in every installed copy's update dialog.
      - name: Appcast release notes
        run: python3 scripts/test_appcast.py

  macos-compose-integration:
    name: macOS Compose Integration
    # Pull requests only, for the same NAS-contention reason as docker-build.
    if: github.event_name != 'push'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    # **This job had never once passed, for two independent reasons, and the fix for
    # the first guaranteed the second.** Recorded because the previous comment here
    # described a cause that was not the cause.
    #
    # 1. `error getting credentials — keychain cannot be accessed because the current
    #    session does not allow user interaction`. Not a locked keychain: it is
    #    unlocked, with no timeout. The runner's LaunchAgent carried
    #    `SessionCreate = true`, which puts it in its own security session, and
    #    securityd will not release an item to a session that cannot prompt. Docker
    #    Desktop resolves registry auth through its own credential service
    #    (`credsStore: "desktop"`, not `osxkeychain`), which ignores DOCKER_CONFIG —
    #    so no amount of config override here could have helped. Fixed on the runner
    #    host by removing that key from
    #    ~/Library/LaunchAgents/actions.runner.seethroughlab.jeffbook.plist.
    #
    # 2. `DOCKER_BUILDKIT: '0'` was set to route around the above, and the classic
    #    builder cannot read `RUN --mount=type=cache`, which docker/Dockerfile uses
    #    at step 23. So the workaround for the first problem made the build fail
    #    outright. It is gone; BuildKit's auth path works now that the session does.
    #
    # `continue-on-error` was also here, and it does not do what it was added for:
    # the workflow conclusion goes green but the *check run* still reports failure,
    # which is what a PR shows. It is removed rather than left as a comment that
    # misdescribes the behaviour — this job either gates or it does not.
    env:
      DOCKER_CONFIG: /tmp/familiar-ci-docker-config
    steps:
      - uses: actions/checkout@v4

      # Fails in a second with the remedy, instead of four minutes later inside a Docker
      # build with an error message that blames a locked keychain. `svc.sh install`
      # rewrites this key on every runner reinstall, so the fix is one `svc.sh` away from
      # being silently undone — and the symptom is nowhere near the cause.
      - name: Check the runner can reach the keychain
        run: |
          for plist in "$HOME/Library/LaunchAgents"/actions.runner.seethroughlab.*.plist; do
            [ -f "$plist" ] || continue
            value=$(plutil -extract SessionCreate raw "$plist" 2>/dev/null || echo absent)
            if [ "$value" = "true" ]; then
              echo "::error::$(basename "$plist" .plist) has SessionCreate=true, so the runner"
              echo "::error::sits in its own security session and cannot reach the login keychain."
              echo "::error::Docker Desktop's credential service will fail during the build."
              echo "::error::Fix on the runner host: ./scripts/fix-macos-runner-session.sh"
              exit 1
            fi
          done
          echo "Runner session is shared with the login session; the keychain is reachable."

      - name: Prepare keychain-free Docker config
        run: |
          rm -rf "$DOCKER_CONFIG"
          mkdir -p "$DOCKER_CONFIG"
          # `credsStore: ""` tells Docker to skip credential helpers entirely. Kept as
          # belt and braces rather than as the fix: it verifiably works for the CLI —
          # a deliberately bogus helper name here does get invoked and does fail — but
          # Docker Desktop's own credential service never consulted this file, which
          # is why it never addressed the failure above.
          echo '{"credsStore":"","credHelpers":{},"auths":{}}' > "$DOCKER_CONFIG/config.json"
          # Docker looks up CLI plugins (compose, buildx) under
          # $DOCKER_CONFIG/cli-plugins. Without this symlink, `docker compose`
          # is unrecognized and -f is interpreted as a flag to plain docker.
          for src in "$HOME/.docker/cli-plugins" /usr/local/lib/docker/cli-plugins /opt/homebrew/lib/docker/cli-plugins; do
            if [ -d "$src" ]; then
              ln -s "$src" "$DOCKER_CONFIG/cli-plugins"
              break
            fi
          done
          docker compose version

      - name: Clean up previous containers and volumes
        working-directory: docker
        run: |
          docker compose -f docker-compose.local.yml down -v 2>/dev/null || true
          docker compose -f docker-compose.prod.yml down -v 2>/dev/null || true

      # Not 4400: this runner is a Mac that may be running Familiar Server, which listens there,
      # and a health check that reached it would pass without testing the stack at all.
      - name: Create .env for test
        working-directory: docker
        run: |
          if lsof -nP -iTCP:4410 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "::error::port 4410 is already in use on this runner"; exit 1
          fi
          echo "MUSIC_LIBRARY_PATH=${{ github.workspace }}/backend/tests/fixtures/audio" > .env
          echo "API_PORT=4410" >> .env
          echo "FRONTEND_URL=http://localhost:4410" >> .env

      # Use local build compose (builds from source) since the published
      # image may not have an ARM64 manifest yet
      - name: Build and start stack
        working-directory: docker
        run: docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for API health check
        run: |
          echo "Waiting for API to be healthy..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4410/api/v1/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy"
              curl -s http://localhost:4410/api/v1/health | python3 -m json.tool
              exit 0
            fi
            echo "Attempt $i/40: HTTP $STATUS (waiting 5s...)"
            sleep 5
          done
          echo "::error::API health check failed after 200 seconds"
          docker compose -f docker/docker-compose.local.yml logs
          exit 1

      # ADR-0141: this stack is a new server (no token, no tracks), so it must have minted a token,
      # printed the owner's sign-in link to its log, and now refuse the API without that token.
      - name: A new server starts with a token
        working-directory: docker
        run: |
          docker compose -f docker-compose.local.yml logs api | grep -q '/#token=' \
            || { echo "::error::no sign-in link in the api container's log"; docker compose -f docker-compose.local.yml logs api | tail -40; exit 1; }
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4410/api/v1/tracks)
          [ "$STATUS" = "401" ] || { echo "::error::/api/v1/tracks without a token answered $STATUS, not 401"; exit 1; }
          docker compose -f docker-compose.local.yml exec -T api python -m app.token | grep -q '/#token=' \
            || { echo "::error::python -m app.token printed no link"; exit 1; }
          echo "minted at first start, sign-in link logged, API closed without it, app.token reprints it"

      - name: Verify containers are running
        working-directory: docker
        run: |
          docker compose -f docker-compose.local.yml ps
          RUNNING=$(docker compose -f docker-compose.local.yml ps --status running -q | wc -l | tr -d ' ')
          if [ "$RUNNING" -lt 3 ]; then
            echo "::error::Expected 3 running containers, got $RUNNING"
            docker compose -f docker-compose.local.yml logs
            exit 1
          fi

      - name: Dump logs on failure
        working-directory: docker
        if: failure()
        run: docker compose -f docker-compose.local.yml logs --tail=50

      - name: Stop stack and clean up volumes
        working-directory: docker
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  migration-lint:
    name: Migration Lint
    # **Linux, not bare `self-hosted`.** This job runs `uv`, and `UV_PYTHON` is pinned to a patch
    # release that python-build-standalone publishes for Linux but not for macOS/arm64 — a bare
    # `self-hosted` label matches the macOS runner too, and the job then dies on
    # `No download found for request: cpython-3.11.15-macos-aarch64-none` before running a check.
    # It only surfaced when `CI_RUNNER` was cleared: while it was `ubuntu-latest` these landed on
    # hosted Linux and the ambiguity never showed.
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # Every job here runs on a self-hosted runner, whose uv cache already persists
          # on local disk between runs — the hosted cache adds nothing and its post-job
          # prune has been failing (exit 2), marking jobs red while all tests passed.
          enable-cache: false

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Lint migrations
        working-directory: backend
        run: uv run python scripts/lint_migrations.py

  backend-lint:
    name: Backend Lint
    # **Linux, not bare `self-hosted`.** This job runs `uv`, and `UV_PYTHON` is pinned to a patch
    # release that python-build-standalone publishes for Linux but not for macOS/arm64 — a bare
    # `self-hosted` label matches the macOS runner too, and the job then dies on
    # `No download found for request: cpython-3.11.15-macos-aarch64-none` before running a check.
    # It only surfaced when `CI_RUNNER` was cleared: while it was `ubuntu-latest` these landed on
    # hosted Linux and the ambiguity never showed.
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      UV_HTTP_TIMEOUT: '120'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # Every job here runs on a self-hosted runner, whose uv cache already persists
          # on local disk between runs — the hosted cache adds nothing and its post-job
          # prune has been failing (exit 2), marking jobs red while all tests passed.
          enable-cache: false

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy app --ignore-missing-imports

      - name: Lint profile contracts
        run: uv run python scripts/lint_profile_contracts.py

      # ADR-0130 point 9: operations and the container are HTTP-free, services do not reach into
      # routes, nothing imports the assembled app. Pure AST; needs no database.
      - name: Lint import boundaries
        run: uv run python scripts/lint_boundaries.py

      # ADR-0132 point 2: server state derives from settings.data_dir, never the working
      # directory, so a server started outside /app finds it. Pure AST; needs no database.
      - name: Lint data paths
        run: uv run python scripts/lint_data_paths.py

      # ADR-0127 points 6 and 9: the current-state docs name only things that exist, and the ADR
      # index is regenerated from the records. Pure Python over the tree; no database.
      - name: Docs name only what exists
        working-directory: .
        run: |
          python3 scripts/check_docs.py
          python3 scripts/adr_index.py --check

      # Both Dockerfiles copy workspace packages by name; a package missing from one fails that
      # image's build only when that image is next built — for the demo, silently on every push.
      - name: Dockerfiles copy every workspace package the web build reaches
        working-directory: .
        run: python3 scripts/check_dockerfiles.py

      # Imports app.main, so it needs `uv sync --extra dev` above — it cannot move to
      # the migration-lint job, which deliberately runs stdlib-only scripts. This job
      # also runs on a bare checkout with no backend/static/, which matters: a built
      # frontend adds SPA routes and changes the schema.
      - name: Lint OpenAPI schema
        run: uv run python scripts/lint_openapi.py

      # The committed schema is what familiar-apple generates its Swift client from
      # (ADR-0007 phase 2). A stale one means a client built against an API that no longer
      # exists, and nothing else would catch it. Runs in the same bare-checkout job for the
      # same reason the lint does.
      - name: Check committed OpenAPI schema is current
        run: uv run python scripts/dump_openapi.py --check

      # The step above proves the artifact is current. This one proves somebody *looked* at what
      # changed: it fails when the API shape moved while API_CONTRACT_VERSION stayed put, so a
      # change that breaks an already-shipped app cannot land as a silent diff (ADR-0113).
      - name: Check the API contract version was considered
        run: uv run python scripts/check_contract_bump.py --check

  backend-test-contract:
    name: Backend Test (Contract)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      UV_HTTP_TIMEOUT: '120'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familiar
          POSTGRES_PASSWORD: familiar
          POSTGRES_DB: familiar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # Every job here runs on a self-hosted runner, whose uv cache already persists
          # on local disk between runs — the hosted cache adds nothing and its post-job
          # prune has been failing (exit 2), marking jobs red while all tests passed.
          enable-cache: false

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
        run: uv run python -m alembic upgrade head

      - name: Migration preflight
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
        run: uv run python -c "from app.db.migration_preflight import assert_database_at_head; assert_database_at_head()"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
          REDIS_URL: redis://localhost:6379/0
        # Baseline 2026-03-18: TBD (set from first CI run). Threshold set conservatively low.
        run: uv run pytest tests/test_contract_error_shapes.py tests/test_contract_auth_matrix.py tests/test_contract_envelope_parity.py tests/test_contract_happy_path.py tests/test_migrations.py -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=12 --junit-xml=results-contract.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-contract
          path: backend/results-contract.xml

      - name: Check skip budget
        if: always()
        working-directory: backend
        run: |
          SKIP_COUNT=$(grep -c '<skipped' results-contract.xml 2>/dev/null || echo 0)
          echo "Skipped tests: $SKIP_COUNT (budget: 2)"
          if [ "$SKIP_COUNT" -gt 2 ]; then
            echo "::error::Skip budget exceeded: $SKIP_COUNT skipped (budget: 2)"
            exit 1
          fi

  backend-test-core:
    name: Backend Test (Core)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      UV_HTTP_TIMEOUT: '120'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familiar
          POSTGRES_PASSWORD: familiar
          POSTGRES_DB: familiar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # Every job here runs on a self-hosted runner, whose uv cache already persists
          # on local disk between runs — the hosted cache adds nothing and its post-job
          # prune has been failing (exit 2), marking jobs red while all tests passed.
          enable-cache: false

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
        run: uv run python -m alembic upgrade head

      - name: Migration preflight
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
        run: uv run python -c "from app.db.migration_preflight import assert_database_at_head; assert_database_at_head()"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest --ignore=tests/test_contract_error_shapes.py --ignore=tests/test_contract_auth_matrix.py --ignore=tests/test_contract_envelope_parity.py --ignore=tests/test_contract_happy_path.py --ignore=tests/test_migrations.py -k "not integration" -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=35 --junit-xml=results-core.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-core
          path: backend/results-core.xml

      - name: Check skip budget
        if: always()
        working-directory: backend
        run: |
          SKIP_COUNT=$(grep -c '<skipped' results-core.xml 2>/dev/null || echo 0)
          echo "Skipped tests: $SKIP_COUNT (budget: 5)"
          if [ "$SKIP_COUNT" -gt 5 ]; then
            echo "::error::Skip budget exceeded: $SKIP_COUNT skipped (budget: 5)"
            exit 1
          fi

  # ADR-0133 point 6: the same core selection with no Redis at all, which is how a server outside
  # Docker runs. Every store operation then goes to the Postgres tables. No coverage and no skip
  # budget: the Redis half of tests/test_kv_store.py skips here by design, and core already
  # measures coverage.
  backend-test-no-redis:
    name: Backend Test (Core, no Redis)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      UV_HTTP_TIMEOUT: '120'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familiar
          POSTGRES_PASSWORD: familiar
          POSTGRES_DB: familiar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
        run: uv run python -m alembic upgrade head

      - name: Run tests without REDIS_URL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
        run: uv run pytest --ignore=tests/test_contract_error_shapes.py --ignore=tests/test_contract_auth_matrix.py --ignore=tests/test_contract_envelope_parity.py --ignore=tests/test_contract_happy_path.py --ignore=tests/test_migrations.py -k "not integration" -q --tb=short --no-cov

  backend-test-integration:
    name: Backend Test (Integration)
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      UV_HTTP_TIMEOUT: '120'
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familiar
          POSTGRES_PASSWORD: familiar
          POSTGRES_DB: familiar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # Every job here runs on a self-hosted runner, whose uv cache already persists
          # on local disk between runs — the hosted cache adds nothing and its post-job
          # prune has been failing (exit 2), marking jobs red while all tests passed.
          enable-cache: false

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
        run: uv run python -m alembic upgrade head

      - name: Migration preflight
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
        run: uv run python -c "from app.db.migration_preflight import assert_database_at_head; assert_database_at_head()"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar_test
          REDIS_URL: redis://localhost:6379/0
        # Baseline 2026-03-18: TBD (set from first CI run). Threshold set conservatively low; more variance due to --reruns.
        run: uv run pytest -k "integration" -v --tb=short --reruns 2 --reruns-delay 1 --cov=app --cov-report=term-missing --cov-fail-under=5 --junit-xml=results-integration.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration
          path: backend/results-integration.xml

      - name: Check skip budget
        if: always()
        working-directory: backend
        run: |
          SKIP_COUNT=$(grep -c '<skipped' results-integration.xml 2>/dev/null || echo 0)
          echo "Skipped tests: $SKIP_COUNT (budget: 3)"
          if [ "$SKIP_COUNT" -gt 3 ]; then
            echo "::error::Skip budget exceeded: $SKIP_COUNT skipped (budget: 3)"
            exit 1
          fi

      - name: Check for flaky tests (reruns)
        if: always()
        working-directory: backend
        run: |
          RERUN_COUNT=$(grep -c 'rerun' results-integration.xml 2>/dev/null || echo 0)
          if [ "$RERUN_COUNT" -gt 0 ]; then
            echo "::warning::$RERUN_COUNT test(s) required reruns - these may be flaky"
            grep 'rerun' results-integration.xml || true
          fi

  frontend-lint:
    name: Frontend Lint
    # **Linux, not bare `self-hosted`.** These three are Node jobs with no reason to want macOS, and
    # a bare label let them pile onto the one Mac — which is shared with `familiar-apple`'s CI and is
    # the only runner that can take the macOS jobs. Four workers started there within two minutes on
    # 2026-08-26, all unpacking the same action archives into the shared `_actions/` tree, and one
    # hung in `tar -xzf` of `pnpm/action-setup` before a single step ran. GitHub killed it at twenty
    # minutes and reported `cancelled`, which reads as a failure on the pull request.
    #
    # That happened five times in a day, always to `Frontend Build`. Moving them here leaves the Mac
    # for the two jobs that genuinely need it.
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
      NPM_CONFIG_FETCH_TIMEOUT: '600000'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @familiar/frontend run lint

      - name: Embed Guardrail Checks
        run: pnpm --filter @familiar/frontend run check:embed-guardrails

      - name: Dependency Boundary Checks
        run: pnpm --filter @familiar/frontend run check:boundaries

      # ADR-0129 point 2: the web client is generated from backend/openapi.json and committed.
      # Regenerate and fail on a diff, so a contract change, its lock and its generated clients
      # are one reviewable change. Pure file transformation; needs no backend.
      - name: Check generated API client is current
        run: pnpm --filter @familiar/api-client run check

      - name: Type-check generated API client
        run: pnpm --filter @familiar/api-client run typecheck

  frontend-test:
    name: Frontend Test
    # **Linux, not bare `self-hosted`.** These three are Node jobs with no reason to want macOS, and
    # a bare label let them pile onto the one Mac — which is shared with `familiar-apple`'s CI and is
    # the only runner that can take the macOS jobs. Four workers started there within two minutes on
    # 2026-08-26, all unpacking the same action archives into the shared `_actions/` tree, and one
    # hung in `tar -xzf` of `pnpm/action-setup` before a single step ran. GitHub killed it at twenty
    # minutes and reported `cancelled`, which reads as a failure on the pull request.
    #
    # That happened five times in a day, always to `Frontend Build`. Moving them here leaves the Mac
    # for the two jobs that genuinely need it.
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
      NPM_CONFIG_FETCH_TIMEOUT: '600000'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter @familiar/frontend test

      # ADR-0125 point 4: the bridge against the recorded protocol, and every visualizer type-checked.
      # The visualizers had never been through `tsc` — Vite strips types without looking, which is
      # how an import of a type nothing exported shipped for months.
      - name: Visualizer SDK tests and type checks
        run: |
          pnpm --filter @familiar/visualizer-sdk test
          pnpm --filter @familiar/visualizer-sdk typecheck
          pnpm -r --filter './packages/visualizers/*' typecheck

  # The marketing site's own tests (site/e2e). Until 2026-10-03 nothing ran them: the deploy runs
  # check-claims.py, which audits links and claims but not what the page does, so the install
  # chooser, the no-JavaScript render and the shared nav were rules on paper. Static HTML over
  # file://, no server.
  site-test:
    name: Site Test
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
      NPM_CONFIG_FETCH_TIMEOUT: '600000'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/web
        run: npx playwright install --with-deps chromium

      - name: Run site tests
        working-directory: packages/web
        run: npx playwright test --config=../../site/playwright.config.ts

  frontend-build:
    name: Frontend Build
    # **Linux, not bare `self-hosted`.** These three are Node jobs with no reason to want macOS, and
    # a bare label let them pile onto the one Mac — which is shared with `familiar-apple`'s CI and is
    # the only runner that can take the macOS jobs. Four workers started there within two minutes on
    # 2026-08-26, all unpacking the same action archives into the shared `_actions/` tree, and one
    # hung in `tar -xzf` of `pnpm/action-setup` before a single step ran. GitHub killed it at twenty
    # minutes and reported `cancelled`, which reads as a failure on the pull request.
    #
    # That happened five times in a day, always to `Frontend Build`. Moving them here leaves the Mac
    # for the two jobs that genuinely need it.
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
      NPM_CONFIG_FETCH_TIMEOUT: '600000'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @familiar/web run build

      # ADR-0125: the four first-party visualizer documents build from the workspace, each into
      # its own dist/. They are vendored into familiar-apple by hand; this proves they still build.
      - name: Build visualizer documents
        run: pnpm --filter @familiar/visualizers build

      - name: Bundle Budget Checks
        env:
          # Temporary bootstrap hard ceiling while Phase 6 split work reduces entry size.
          # Targets are still enforced as warnings by the checker.
          BUNDLE_ENTRY_GZIP_HARD_KB: '460'
        run: pnpm --filter @familiar/web run check:bundle-budgets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/web/dist
          retention-days: 7

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-perf-metrics
          path: artifacts/perf
          retention-days: 7

  docker-build:
    name: Docker Build
    # Pull requests only: on a merge it would re-validate an image the PR run already built.
    if: github.event_name != 'push'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    # No longer `continue-on-error`. It was advisory because the NAS's network made 30-minute
    # builds flake on TCP connects and slow mirrors, so a red build said nothing about the code. On a
    # hosted runner it is the same build the release workflow runs, and a broken image is red again.
    needs: [backend-lint, backend-test-contract, backend-test-core, backend-test-no-redis, backend-test-integration, frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub's cache, as release.yml uses, replacing the NAS's persistent builder and the cache
      # folder under /opt/actions-runner/_cache. The scope is this job's own, so it never evicts the
      # release's per-architecture caches.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        timeout-minutes: 55
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: familiar:test
          cache-from: type=gha,scope=ci-docker-build
          cache-to: type=gha,scope=ci-docker-build,mode=max

  e2e-test:
    name: E2E Tests (Playwright)
    # Pull requests only, as docker-build. It used to `need` docker-build purely to *order* the two
    # on the NAS, where a Docker build and a browser suite at once were a bad neighbour; it uses
    # nothing docker-build makes and builds its own frontend and backend. On hosted runners each job
    # has its own machine, so it now waits only for the tests below.
    if: github.event_name != 'push'
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    needs: [backend-lint, backend-test-contract, backend-test-core, backend-test-no-redis, backend-test-integration, frontend-lint, frontend-test]
    # **Deliberately not `continue-on-error`.** It was, and the reason was sound: the job inherited
    # docker-build's flakiness, so a NAS hiccup would have blocked unrelated merges. Decoupling the
    # two removed that reason, and the cost of keeping it had become concrete — the chat
    # specs' `/chat/status` mock never worked in CI, seven of them failed for an unknown length of
    # time, and nothing went red because nothing could. A suite that cannot fail quietly stops being
    # true. If NAS flakiness starts blocking merges through *this* job rather than through
    # docker-build, that is the signal to revisit, and it will be visible rather than silent.
    env:
      UV_HTTP_TIMEOUT: '120'
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
      NPM_CONFIG_FETCH_TIMEOUT: '600000'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familiar
          POSTGRES_PASSWORD: familiar
          POSTGRES_DB: familiar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # Every job here runs on a self-hosted runner, whose uv cache already persists
          # on local disk between runs — the hosted cache adds nothing and its post-job
          # prune has been failing (exit 2), marking jobs red while all tests passed.
          enable-cache: false

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
        run: uv run python -m alembic upgrade head

      - name: Migration preflight
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
        run: uv run python -c "from app.db.migration_preflight import assert_database_at_head; assert_database_at_head()"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for E2E tests
        run: |
          pnpm --filter @familiar/web run build
          mkdir -p backend/static
          cp -r packages/web/dist/* backend/static/

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://familiar:familiar@localhost:5432/familiar
          REDIS_URL: redis://localhost:6379/0
          MUSIC_LIBRARY_PATH: ${{ github.workspace }}/backend/tests/fixtures/audio
          # The fixtures are a checkout, so writable, and the server refuses a writable library
          # (ADR-0136). Not chmod: read-only directories on a self-hosted runner break the next
          # checkout's cleanup.
          FAMILIAR_ALLOW_WRITABLE_LIBRARY: "1"
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 4401 &
          sleep 10

      - name: Install Playwright browsers
        working-directory: packages/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: packages/web
        env:
          BASE_URL: http://localhost:4401
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        # Exclude screenshot specs - they're for README docs, not CI testing
        run: npx playwright test --grep-invert="screenshot"

      # ADR-0125 point 4: each built visualizer document handshakes, survives the recorded events
      # (malformed ones included) and keeps rendering — in a sandboxed frame, served from dist/.
      - name: Visualizer document contract
        run: |
          pnpm --filter @familiar/visualizers build
          pnpm --filter @familiar/visualizers test:documents

      - name: Check for flaky E2E tests (retry-only passes)
        if: always()
        working-directory: packages/web
        run: |
          if [ ! -f playwright-report/results.json ]; then
            echo "No results file found, skipping flake check"
            exit 0
          fi
          node -e "
            const r = require('./playwright-report/results.json');
            const flaky = (r.suites || []).flatMap(s => (s.suites || []).flatMap(ss => ss.specs || []).concat(s.specs || []))
              .filter(s => s.tests?.some(t => t.results?.length > 1 && t.results?.at(-1)?.status === 'passed'))
              || [];
            if (flaky.length > 15) {
              console.log('::warning::' + flaky.length + ' test(s) passed only after retry (flaky):');
              flaky.forEach(s => console.log('  - ' + s.title));
              process.exit(1);
            }
            console.log('No flaky tests detected');
          "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
