<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    The illustration set (ADR-0039 point 4). One file, one symbol per mark, inlined into the page.

    Every mark draws with `currentColor` and hardcodes no colour, which is what makes the set
    theme-aware without a second copy of every file — the property point 4 asks for and the one a
    raster set cannot have.

    `mark-cat` is the reference. See site/ILLUSTRATIONS.md for the grammar and the motif map; give
    this symbol to a generator as the example to match, because matching a real mark produces a more
    consistent set than matching a description.
  -->
  <symbol id="mark-cat" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ears, then the head, drawn as one continuous silhouette so it reads at 20px. -->
    <path d="M6.5 8.2 5.6 4.4l3.3 2.1" />
    <path d="M17.5 8.2l0.9-3.8-3.3 2.1" />
    <path d="M6.5 8.2a6.6 6.6 0 0 1 11 0 6 6 0 0 1-11 0Z" />
    <!-- Eyes: solid, because two open dots at this size read as holes rather than eyes. -->
    <path d="M9.8 10.1v0.9" />
    <path d="M14.2 10.1v0.9" />
    <!-- Muzzle. -->
    <path d="M12 12.4v0.9" />
    <path d="M10.7 14.1a1.7 1.7 0 0 0 2.6 0" />
    <!-- Tail, curled — the flourish that makes it playful rather than a pictogram. -->
    <path d="M17.2 13.4c1.9 1.4 2.6 3.4 1.6 5-0.9 1.5-3 1.6-3.7 0.3-0.5-1 0.2-2 1.2-1.9" />
  </symbol>
</svg>
