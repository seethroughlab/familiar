<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    The illustration set (ADR-0039 point 4). One file, one symbol per mark, inlined into the page.

    **This predates ADR-0054, which dropped the theme-awareness requirement.** `mark-cat` was drawn
    with `currentColor` because point 4 asked for one set that worked in light and dark; the site has
    no light mode and none is planned, and the constraint made every mark monochrome — right for an
    icon, wrong for a black cat.

    It survives as a *grammar* reference: weight, framing, and what reads at 20px. It is not a style
    reference, and ADR-0054's last follow-up is to redraw or drop it once the set commits to a
    register, because a stroked monochrome cat beside a colour set is point 4's own failure mode.

    See site/ILLUSTRATIONS.md for the register choice, the palette and the motif map.
  -->
  <symbol id="mark-cat" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ears, then the head, drawn as one continuous silhouette so it reads at 20px. -->
    <path d="M6.5 8.2 5.6 4.4l3.3 2.1" />
    <path d="M17.5 8.2l0.9-3.8-3.3 2.1" />
    <path d="M6.5 8.2a6.6 6.6 0 0 1 11 0 6 6 0 0 1-11 0Z" />
    <!-- Eyes: solid, because two open dots at this size read as holes rather than eyes. -->
    <path d="M9.8 10.1v0.9" />
    <path d="M14.2 10.1v0.9" />
    <!-- Muzzle. -->
    <path d="M12 12.4v0.9" />
    <path d="M10.7 14.1a1.7 1.7 0 0 0 2.6 0" />
    <!-- Tail, curled — the flourish that makes it playful rather than a pictogram. -->
    <path d="M17.2 13.4c1.9 1.4 2.6 3.4 1.6 5-0.9 1.5-3 1.6-3.7 0.3-0.5-1 0.2-2 1.2-1.9" />
  </symbol>
</svg>
