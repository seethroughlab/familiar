[project]
name = "familiar"
version = "0.1.0"
description = "LLM-powered local music player"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    # Background tasks
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    # Audio metadata
    "mutagen>=1.47.0",
    # Image processing
    "pillow>=10.0.0",
    # HTTP client
    "httpx>=0.26.0",
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Async support
    "greenlet>=3.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Password hashing (for Subsonic API auth)
    "bcrypt>=4.0.0",
    # Utilities
    "python-multipart>=0.0.6",
    "anthropic>=0.75.0",
    "spotipy>=2.25.2",
    "bandcamp-api>=0.2.3",
    "beautifulsoup4>=4.14.3",
    "rapidfuzz>=3.0.0",
    "pyacoustid>=1.3.0",
    "trafilatura>=1.6.0",
    "curl_cffi>=0.7.0",
    "musicbrainzngs>=0.7.1",
    # S3 backup
    "boto3>=1.34.0",
    # Database migrations
    "alembic>=1.13.0",
    # System monitoring
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",  # Coverage reporting
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",  # For TestClient
]

# Phase 1.5: Audio analysis
# Note: torch is installed separately in Docker with CPU-only version (~200MB vs ~5GB CUDA)
# For local dev with GPU: uv pip install torch
# For local dev CPU-only: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
analysis = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "transformers>=4.30.0", # For CLAP model
    "soundfile>=0.12.0", # Audio file loading
    "umap-learn>=0.5.0", # Dimensionality reduction for music map
    "pyloudnorm>=0.1.0", # EBU R128 loudness measurement
    "basic-pitch[onnx]>=0.3.0", # Polyphonic audio-to-MIDI for track analysis
    "matplotlib>=3.5.0", # Self-similarity matrix rendering for track analysis
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/db/models/*.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
# Use non-strict mode until full type coverage is complete
strict = false
ignore_missing_imports = true
# Basic type checking
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = true
# Skip untyped function definitions
disallow_untyped_defs = false
disallow_untyped_calls = false
# Disable strict optional for WebSocket handlers with complex control flow
strict_optional = false

# Exclude files with complex third-party library interactions and legacy code
[[tool.mypy.overrides]]
module = [
    "app.services.metadata",
    "app.services.artwork",
    "app.services.organizer",
    "app.services.analysis",
    "app.workers.tasks",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "app.db.models.tracks",
    "app.db.models.playlists",
    "app.db.models.profiles",
]
disable_error_code = ["name-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Coverage configuration - start low and increase over time
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=38"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/workers/*",  # Workers have external dependencies
    "app/db/migrations/*",  # Migration scripts
    "app/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
# Note: torch is installed separately in Docker with CPU-only version
# Do NOT add extra-index-url for PyTorch here - it causes other packages
# to resolve from PyTorch's limited index (missing wheels for some Python versions)
