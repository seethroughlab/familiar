app = 'familiar-demo'
primary_region = 'sjc'

# Invoke this config from the repo root with:
#   flyctl deploy . \
#       --config deploy/fly/fly.toml \
#       --dockerfile deploy/fly/Dockerfile \
#       --remote-only
#
# The build context must be the repo root so the Dockerfile's `COPY backend/…`
# layers work. Fly would otherwise use fly.toml's directory as the context.

[env]
  MUSIC_LIBRARY_PATH = '/data/music'
  ART_PATH = '/data/art'
  VIDEOS_PATH = '/data/videos'
  DISABLE_CLAP_EMBEDDINGS = 'true'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/api/v1/health'
    timeout = '10s'

[[mounts]]
  source = 'demo_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
