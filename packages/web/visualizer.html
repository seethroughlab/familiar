<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- The theme is declared, not inherited (ADR-0082 point 3). This document is rendered
         inside a WKWebView whose host has its own appearance, and a form control or a
         scrollbar drawn in the system light palette on this dark surface is the give-away
         that it is a web view. `color-scheme` tells the engine which set to use. -->
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Familiar — embedded visualizer surface" />

    <!-- How the native host proves it got *this* document and not the app, and not the Discover
         surface either. A server built before this existed has no `/visualizer` route, and its
         single-page-app fallback answers that path with `index.html` — HTTP 200, and the wrong
         document rendered inside a web view in an app that is already playing.

         That used to be worse than wrong: `index.html` registered a real `WebAudioEngine`, so the
         fallback would hold a second audio session, which is what ADR-0016 point 4 exists to
         prevent. ADR-0071 removed the web player and its engine, so the app document now registers
         none at all — but the marker is not thereby less necessary. A probe that cannot tell which
         document it received cannot tell a working surface from a silent one, which is the defect
         ADR-0017's record keeps finding on this surface. -->


         Note the content differs from the Discover surface's `embed`. The marker was a single flat
         value until this document existed; two surfaces need to be told apart, or the probe cannot
         tell which one it got. -->
    <meta name="familiar-surface" content="visualizer" />

    <!-- Deliberately no manifest and no apple-itunes-app banner, for the same reason as the
         Discover surface: this is only ever loaded inside the app's own web view. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <title>Visualizer</title>
    <style>
      /* Black rather than the app's background: this document is a visualizer and nothing else, and
         a flash of any other colour while three.js compiles reads as a broken screen. The native
         host also draws no background of its own so this is the only thing setting it. */
      html, body, #root { height: 100%; margin: 0; background: #000; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/visualizer.tsx"></script>
  </body>
</html>
