<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      No manifest and no `apple-mobile-web-app-*` tags: ADR-0059 retired the PWA. This is an
      administration page for a server, not something to install to a home screen.

      `apple-itunes-app` stays and is the point — a Smart App Banner sends an iPhone visitor to
      the real listening client, which is what ADR-0050 says the phone should be using.
    -->
    <meta name="theme-color" content="#18181b" />
    <meta name="description" content="Administration for a Familiar music server" />
    <meta name="apple-itunes-app" content="app-id=6759879772" />

    <!-- Icons. Still used by the favicon and the App Store hand-off screen. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>Familiar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
